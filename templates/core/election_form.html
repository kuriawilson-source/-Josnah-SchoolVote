{% extends "base.html" %}
{% block title %}Create election{% endblock %}
{% block content %}
<a class="back-link" href="{% url 'dashboard' %}">← Dashboard</a>
<section class="page-heading"><span class="eyebrow">GET STARTED</span><h1>Create an election</h1><p>Set up the basics now. You can add positions and candidates next.</p></section>
<form method="post" class="card form-card">{% csrf_token %}
  {% for field in form %}
    <label class="field">{{ field.label }}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<span class="form-error">{{ error }}</span>{% endfor %}</label>
  {% endfor %}
  <div class="form-actions"><a class="button secondary" href="{% url 'dashboard' %}">Cancel</a><button class="button primary" type="submit">Create election →</button></div>
</form>
{% endblock %}
